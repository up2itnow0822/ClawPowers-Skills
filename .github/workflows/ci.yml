name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:wasm
      - run: npm run build
      - run: npm run verify:pack
      - run: npm run verify:consumer-install
      - run: npm audit --omit=dev
      - name: Verify packaged WASM fallback artifacts
        run: node scripts/verify-wasm-artifacts.mjs

  native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('native/Cargo.lock') }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Test native workspace
        # https://github.com/up2itnow0822/ClawPowers-Skills/issues/236
        run: cargo test --workspace --locked --all-features --exclude clawpowers-wasm
        working-directory: native
      - name: Build FFI crate
        run: cargo build -p clawpowers-ffi --locked
        working-directory: native
