name: hermes-compatibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

jobs:
  pinned-hermes-skill-surface:
    name: Verify skills against pinned Hermes Agent (v0.22.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ClawPowers-Skills
        uses: actions/checkout@v6

      - name: Checkout Hermes Agent
        uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          # Pin to v0.22.4, the last Hermes release whose core extra
          # resolves under pip. Hermes v0.22.5+ / main pin
          # Pillow==13.0.0 on Python 3.14+ (27c61463814, GHSA-8g5g-8vmr-9782)
          # while browser-harness 0.1.13 still pins pillow==12.3.0, so
          # `pip install -e .` raises ResolutionImpossible. Hermes itself
          # works around this with a [tool.uv] override that pip does not
          # honor, and no newer browser-harness exists. Lift this pin when
          # browser-harness allows Pillow 13 or `pip install -e .` on
          # hermes-agent@main succeeds again.
          ref: 4d04303818b61bf3aa09278af48356315515965b # v0.22.4
          path: .hermes-agent

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Track the Python version Hermes Agent itself pins. Upstream gates every
          # core dependency on python_version >= '3.14', so an older interpreter
          # installs hermes-agent with no dependencies (e.g. ruamel.yaml missing).
          python-version-file: .hermes-agent/.python-version

      - name: Install Hermes Agent core dependencies
        working-directory: .hermes-agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Syntax-check Hermes verifier
        run: python3 -m py_compile scripts/verify_hermes_wrappers.py

      - name: Verify ClawPowers skills load in pinned Hermes Agent (v0.22.4)
        run: python3 scripts/verify_hermes_wrappers.py --hermes-agent "$GITHUB_WORKSPACE/.hermes-agent"
